name: run

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python check.py
      - run: python tsp.py | tail -n 1
      - run: python plot_progress.py | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: elitism-comparison
          path: elitism_comparison.png
